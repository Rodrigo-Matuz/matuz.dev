<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- PNG fallbacks: Discord/Slack/iMessage don't render SVG favicons,
         and embed previews pick og:image / twitter:image for the thumbnail. -->
        <link
            rel="icon"
            type="image/png"
            sizes="512x512"
            href="/favicon-512.png"
        />
        <link rel="apple-touch-icon" href="/favicon-512.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Primary meta -->
        <title>
            Rodrigo dos Santos Lima — Full-stack Developer · matuz.dev
        </title>
        <meta
            name="description"
            content="Portfolio of Rodrigo dos Santos Lima (Matuz), a full-stack developer based in Brazil. Websites, applications, desktop software, and the systems connecting them."
        />
        <meta name="theme-color" content="#702EF3" />
        <meta name="author" content="Rodrigo dos Santos Lima" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://matuz.dev/" />
        <meta
            property="og:title"
            content="Rodrigo dos Santos Lima — Full-stack Developer"
        />
        <meta
            property="og:description"
            content="Software for whatever needs building. Websites, applications, desktop software, and the systems connecting them."
        />
        <meta property="og:site_name" content="matuz.dev" />
        <meta property="og:locale" content="pt_BR" />
        <meta property="og:locale:alternate" content="en_US" />
        <!-- Embed thumbnail (Discord "small image"): the site favicon. -->
        <meta property="og:image" content="https://matuz.dev/favicon-512.png" />
        <meta property="og:image:width" content="512" />
        <meta property="og:image:height" content="512" />
        <meta property="og:image:alt" content="matuz.dev logo" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary" />
        <meta
            name="twitter:title"
            content="Rodrigo dos Santos Lima — Full-stack Developer"
        />
        <meta
            name="twitter:description"
            content="Software for whatever needs building. Websites, applications, desktop software, and the systems connecting them."
        />
        <meta
            name="twitter:image"
            content="https://matuz.dev/favicon-512.png"
        />

        <!-- Fonts: preconnect + Inter (sans, incl. italics), JetBrains Mono (mono), Newsreader (display serif) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
